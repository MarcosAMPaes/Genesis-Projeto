[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "petra-smart"
version = "0.1.0"
description = "Metrologia e segmentacao de fragmentos de rochas ornamentais"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Equipe Petra Smart" }]
dependencies = [
  "jsonschema>=4.24,<5",
  "numpy>=2,<3",
  "opencv-python-headless>=4.13,<6",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "python-ulid>=3.1,<4",
  "scipy>=1.16,<2",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
seg-birefnet = [
  "accelerate>=1.9,<2",
  "kornia>=0.8,<1",
  "timm>=1.0,<2",
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=4.53,<6",
]
seg-sam2 = [
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=4.53,<6",
]
seg-sam3 = [
  "huggingface-hub>=0.33,<2",
  "iopath>=0.1.10,<1",
  "timm>=1.0.17,<2",
  "torch>=2.7",
  "torchvision>=0.22",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pip-licenses>=5,<6",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26,<5",
]

[project.scripts]
petra = "petra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["petra"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "unit: testes unitarios rapidos",
  "contract: validacao de contratos publicos",
  "integration: integracao entre componentes locais",
  "smoke: fluxo minimo reproduzivel",
  "model: requer checkpoint de modelo",
  "benchmark: mede qualidade ou desempenho",
  "physical: requer bancada ou instrumento fisico",
]

[tool.coverage.run]
branch = true
source = ["petra"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["cv2.*", "scipy.*", "shapely.*", "ulid.*"]
ignore_missing_imports = true
