name: quality

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy petra scripts
      - run: uv run python scripts/check_schemas.py
      - run: uv run python scripts/check_licenses.py
      - run: uv run python scripts/lint_validation_corpus.py
      - run: uv run pytest -m "not model and not benchmark and not physical"
