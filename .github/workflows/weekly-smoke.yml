name: weekly-smoke

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  smoke-ab-partial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -m smoke
